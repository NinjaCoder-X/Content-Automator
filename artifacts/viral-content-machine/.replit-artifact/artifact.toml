kind = "web"
previewPath = "/"
title = "Viral Content Machine"
version = "1.0.0"
id = "artifacts/viral-content-machine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24218

[services.development]
run = "pnpm --filter @workspace/viral-content-machine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/viral-content-machine", "run", "build" ]
publicDir = "artifacts/viral-content-machine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24218"
BASE_PATH = "/"
